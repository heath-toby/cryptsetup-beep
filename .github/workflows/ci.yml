name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests + shellcheck + pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: install shellcheck + pyflakes
        # The repo's test runner uses whichever of these it finds. In CI we
        # want all of them to actually run, not be skipped.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck
          python -m pip install pyflakes

      - name: run the project test runner
        run: tests/run-tests.sh
